<div class="bg-primary-container text-on-primary-container px-4 py-2 rounded-full font-bold text-lg shadow-sm">

            </div>

</div>
<h2 class="text-xl font-bold">Fresh Produce</h2>

<div class="flex items-center gap-3 mb-4">

</div>

</div>
<div class="space-y-3">
<label class="flex items-center p-4 bg-surface-container-lowest rounded-xl bubbly-card cursor-pointer">
<input class="w-6 h-6 rounded-full border-2 border-outline-variant text-primary focus:ring-primary-container custom-checkbox mr-4" type="checkbox"/>

<label class="flex items-center p-4 bg-surface-container-lowest rounded-xl bubbly-card cursor-pointer">

<label class="flex items-center p-4 bg-surface-container-lowest rounded-xl bubbly-card cursor-pointer">
