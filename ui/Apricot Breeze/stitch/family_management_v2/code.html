<!DOCTYPE html>
<html class="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Fantongbao - 家庭管理</title>

              "secondary-fixed-dim": "#ead723",
              "on-secondary": "#fff4b0",
              "surface-tint": "#874e00",
              outline: "#95703c",
              "error-container": "#f95630",
              "secondary-dim": "#595000",
              "on-primary-fixed-variant": "#563000",
              surface: "#fff5ec",

              "on-tertiary-fixed-variant": "#00691a",
              "surface-container": "#ffe4c4",

              "on-primary-fixed": "#271300",

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .bubbly-gradient {
        background: linear-gradient(135deg, #874e00 0%, #ff9800 100%);
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface min-h-screen">
    <div class="mx-auto w-full max-w-[375px] min-h-[812px] bg-surface relative overflow-hidden">
      <!-- Decorative blobs -->
      <div class="pointer-events-none absolute -top-24 -right-24 w-64 h-64 rounded-full bg-secondary-fixed opacity-20 blur-3xl"></div>
      <div class="pointer-events-none absolute top-28 -left-24 w-64 h-64 rounded-full bg-tertiary-fixed opacity-12 blur-3xl"></div>

      <!-- Top App Bar -->
      <header class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] z-50 flex items-center justify-between px-5 py-4 bg-orange-50/80 dark:bg-stone-900/80 backdrop-blur-md">
        <button id="backButton" class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface-variant active:scale-90 transition-transform" aria-label="返回">
          <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
        </button>
        <div class="text-lg font-black tracking-tight">家庭管理</div>
        <div class="w-10 h-10" aria-hidden="true"></div>
      </header>

      <main class="relative z-10 pt-24 px-5 pb-8 space-y-6">
        <!-- ============ A. 家庭列表模式 ============ -->
        <section id="familyListMode" class="space-y-4">
          <div class="bg-surface-container rounded-lg p-5">
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="text-xs font-black uppercase tracking-widest text-on-surface-variant">你的家庭</div>
                <div class="mt-1 text-xl font-extrabold tracking-tight">选择一个家庭继续</div>
                <div class="mt-1 text-sm font-semibold text-on-surface-variant">创建 / 加入 / 切换当前家庭</div>
              </div>
              <div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center">
                <span class="material-symbols-outlined text-on-secondary-container" data-icon="home">home</span>
              </div>
            </div>
          </div>

          <!-- 家庭列表 -->
          <div class="space-y-3">
            <button data-action="open-family-detail" class="w-full bg-surface-container-lowest rounded-lg p-4 text-left hover:bg-surface-container active:scale-[0.99] transition-all" aria-label="选择家庭：李家厨房（当前）">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <div class="text-lg font-extrabold text-on-surface truncate">李家厨房</div>
                    <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-secondary-container text-on-secondary-container">当前</span>
                  </div>
                  <div class="mt-1 text-sm font-semibold text-on-surface-variant">管理员 · 4 人 · 18 个菜谱</div>
                </div>
                <span class="material-symbols-outlined text-primary mt-1" data-icon="check_circle">check_circle</span>
              </div>
            </button>

            <button data-action="open-family-detail" class="w-full bg-surface-container-lowest rounded-lg p-4 text-left hover:bg-surface-container active:scale-[0.99] transition-all" aria-label="选择家庭：爷爷奶奶家">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <div class="text-lg font-extrabold text-on-surface truncate">爷爷奶奶家</div>
                  </div>
                  <div class="mt-1 text-sm font-semibold text-on-surface-variant">成员 · 3 人 · 9 个菜谱</div>
                </div>
                <span class="material-symbols-outlined text-outline mt-1" data-icon="chevron_right">chevron_right</span>
              </div>
            </button>

            <!-- 空态（把 hidden 去掉即可） -->
            <div class="hidden bg-surface-container-lowest rounded-lg p-6 text-center">
              <div class="mx-auto w-12 h-12 rounded-full bg-surface-container flex items-center justify-center">
                <span class="material-symbols-outlined text-outline" data-icon="group">group</span>
              </div>
              <div class="mt-3 font-extrabold text-on-surface">暂无家庭，请创建或加入</div>
              <div class="mt-1 text-sm font-semibold text-on-surface-variant">加入现有家庭需要邀请码</div>
            </div>
          </div>

          <!-- 底部按钮 -->
          <div class="pt-2 grid grid-cols-2 gap-3">
            <button data-action="open-modal-join" class="py-4 rounded-full bg-secondary-container text-on-secondary-container font-extrabold text-base hover:bg-secondary-fixed active:scale-95 transition-all flex items-center justify-center gap-2" aria-label="加入家庭">
              <span class="material-symbols-outlined" data-icon="vpn_key">vpn_key</span>
              加入家庭
            </button>
            <button data-action="open-modal-create" class="py-4 rounded-full bubbly-gradient text-on-primary font-extrabold text-base shadow-[0_12px_24px_rgba(135,78,0,0.18)] active:scale-95 transition-transform flex items-center justify-center gap-2" aria-label="创建家庭">
              <span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
              创建家庭
            </button>
          </div>
        </section>

        <!-- ============ B. 家庭详情模式（示例，默认隐藏） ============ -->
        <section id="familyDetailMode" class="hidden space-y-4" aria-label="家庭详情模式">
          <!-- 当前家庭标题卡 -->

            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">

                <div class="mt-1 text-2xl font-extrabold tracking-tight truncate">李家厨房</div>
                <div class="mt-1 text-sm font-semibold text-on-surface-variant">管理成员 · 查看菜谱预览 · 邀请加入</div>

              <div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center">

                <div class="text-xs font-extrabold text-on-surface text-center leading-tight">

              </div>
              <div class="flex flex-col items-center gap-2 min-w-[72px]">
                <img
                  alt="成员头像"
                  class="w-14 h-14 rounded-full ring-4 ring-surface-container"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuDeLJNlV1NiRUTvahGAW8EFoH3ZZTTv3kKbU7BX5tXYyADGjIiv-gqj4SF_20FBJxw2hPgZ3DR20wFFTao0CoGiIVQ-aXs_9h4Mn958gv7xzBPKOdOGKKe43FESL2j_dAo8eISsy3hVoMPrU3GASTadppP5MgS0la5S2Cw8PBlfK653OjvDf18o9Haa2xiJJ-YdjzNUn1Xo1du-ysg9iA_tq5tLwKn7EQt0f19-YYv2tDUDtT8r21xZqehPXQpade0XN4C1LEr29qE"
                />
                <div class="text-xs font-extrabold text-on-surface text-center leading-tight">
                  小雨
                  <div class="text-[10px] font-bold text-on-surface-variant">成员</div>
                </div>
              </div>
              <div class="flex flex-col items-center gap-2 min-w-[72px]">
                <div class="w-14 h-14 rounded-full ring-4 ring-surface-container bg-surface-container-highest flex items-center justify-center">
                  <span class="material-symbols-outlined text-outline" data-icon="person">person</span>
                </div>
                <div class="text-xs font-extrabold text-on-surface text-center leading-tight">
                  （加载中）
                  <div class="text-[10px] font-bold text-on-surface-variant">…</div>
                </div>
              </div>
            </div>

            <div class="hidden text-sm font-semibold text-on-surface-variant text-center py-4">暂无成员</div>
          </div>

          <!-- 卡片 2：家庭菜谱 -->
          <div class="bg-surface-container-lowest rounded-lg p-5 space-y-4">
            <div class="flex items-center justify-between">
              <div class="text-lg font-extrabold">家庭菜谱</div>
              <span class="text-xs font-extrabold text-primary px-3 py-1 bg-surface-container-high rounded-full">18 个</span>
            </div>

            <div class="grid grid-cols-4 gap-2">
              <div class="aspect-square rounded-lg overflow-hidden bg-surface-container">
                <img
                  alt="菜谱预览"
                  class="w-full h-full object-cover"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuBBg5SIQJ2YZiMlJcp3a8nNcLollxI-bJ-rsHbN2a85yG4WDdKU7LH6Vx1TpTymWCAAj5TVuVBm9f5yA5hIgxWO5QRpwoiwMm3XONYPVO8dcV0h7YSNx90SLpmP7C-fZZy7t1WD6cl0Qg2Zy-XcMCb05aW324nmUkq3zByHhjdRAbzzRFKWrqi3K92NI0yDNW9uim-G2ymJwkqbjP0lbJZXDNFIEjAIGjE6w9_0j6Meq4RmKcRIKS6tCIq7CPMgLHNKeHk8e9XlqC0"
                />
              </div>
              <div class="aspect-square rounded-lg overflow-hidden bg-surface-container">
                <img
                  alt="菜谱预览"
                  class="w-full h-full object-cover"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIJeOdS92CtMRi9_yJQv_65IUm3q60TFEAvAJQdmyV16TJq8Lmt3zpHWz8MJtjVQKce6lD-i3KQApwJorwSJinWdPM62vuA4MLMUM2dRRZP2FJUXkCOGW-0wxDArj1KHZd7VPb_2XExYOeKgjLNY-bRudZZQveh3NC37tCmc2uO8pEIg6gtnSILnlCiFWyezCcW3NSqxOenv6xHUZeT57_Ajn_6D-4dp3gNQeIPkCiE4wNIVUCLyFlw85sX9azJIpha5QJCc2yg50"
                />
              </div>
              <div class="aspect-square rounded-lg overflow-hidden bg-surface-container">
                <img
                  alt="菜谱预览"
                  class="w-full h-full object-cover"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgNIT8yYn79CEAQR2ygu-JxGhELwd9b687GGjg2DHkyijgwuBTzTrq9xKBXufKfB7PQzczEcyMMcPAZip6Tq_bnPZF6xQ2v4Di0DALeQaaB3NM87hNOj9shMDbA0x7Qwh4qhZY80b151ISs-kj2VdfvUoZ50XFMLuiysKT8ZIbzH6E1lqt66PMfEu5OlBC1FRMb7UFuNCrhjl5y3cWWgUVe-fo9VSTZX17Szetaln3JUcOgggp1BuHCDTFuNiXgKd80DGurrO30wQ"
                />
              </div>
              <div class="aspect-square rounded-lg overflow-hidden bg-surface-container flex items-center justify-center">
                <span class="material-symbols-outlined text-outline" data-icon="more_horiz">more_horiz</span>
              </div>
            </div>

            <div class="hidden text-sm font-semibold text-on-surface-variant text-center py-4">暂无菜谱</div>
          </div>

          <!-- 卡片 3：家庭管理 -->
          <div class="bg-surface-container-lowest rounded-lg p-5 space-y-4">
            <div class="text-lg font-extrabold">家庭管理</div>

            <div class="bg-surface-container rounded-lg p-4 flex items-center justify-between gap-3">
              <div class="min-w-0">
                <div class="text-xs font-black uppercase tracking-widest text-on-surface-variant">家庭邀请码</div>
                <div class="mt-1 text-xl font-extrabold tracking-tight truncate">FTB-8K2X</div>
              </div>
              <button class="px-4 py-2 rounded-full bg-surface-container-lowest text-primary font-extrabold active:scale-95 transition-transform" aria-label="复制邀请码">
                复制
              </button>
            </div>

            <button class="w-full py-4 rounded-full bg-error-container text-on-error-container font-extrabold text-base active:scale-95 transition-transform flex items-center justify-center gap-2" aria-label="退出家庭">
              <span class="material-symbols-outlined" data-icon="logout">logout</span>
              退出家庭
            </button>
          </div>
        </section>
      </main>

      <!-- 创建/加入弹窗（共用，显示态示例：把 hidden 去掉即可） -->
      <div id="modalOverlay" class="hidden fixed inset-0 z-[60] bg-black/30 backdrop-blur-[2px]" aria-hidden="true"></div>
      <aside id="familyModal" class="hidden fixed left-1/2 -translate-x-1/2 bottom-0 w-full max-w-[375px] z-[70] bg-white/90 dark:bg-stone-950/90 backdrop-blur-xl rounded-t-[2rem] shadow-[0_-12px_24px_rgba(67,41,0,0.10)] p-5 pb-8">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div id="modalKicker" class="text-xs font-black uppercase tracking-widest text-on-surface-variant">创建 / 加入</div>
            <div id="modalTitle" class="mt-1 text-2xl font-extrabold tracking-tight">请输入家庭名称</div>
          </div>
          <button data-action="close-modal" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center active:scale-90 transition-transform" aria-label="关闭弹窗">
            <span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
          </button>
        </div>

        <div class="mt-5 space-y-3">
          <div class="relative">
            <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-outline" data-icon="edit">edit</span>
            </div>
            <input
              id="modalInput"
              class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-none rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container transition-all"
              placeholder="例如：李家厨房"
              type="text"
              value=""
            />
          </div>

          <div class="grid grid-cols-2 gap-3 pt-1">
            <button data-action="close-modal" class="py-4 rounded-full bg-surface-container text-on-surface font-extrabold active:scale-95 transition-transform" aria-label="取消">
              取消
            </button>
            <button id="modalConfirm" class="py-4 rounded-full bubbly-gradient text-on-primary font-extrabold shadow-[0_12px_24px_rgba(135,78,0,0.16)] active:scale-95 transition-transform" aria-label="确定">
              确定
            </button>
          </div>
        </div>
      </aside>

      <script>
        (function () {
          const el = (id) => document.getElementById(id);
          const listMode = el("familyListMode");
          const detailMode = el("familyDetailMode");
          const backButton = el("backButton");

          const overlay = el("modalOverlay");
          const modal = el("familyModal");
          const modalKicker = el("modalKicker");
          const modalTitle = el("modalTitle");
          const modalInput = el("modalInput");
          const modalConfirm = el("modalConfirm");

          const show = (node) => node && node.classList.remove("hidden");
          const hide = (node) => node && node.classList.add("hidden");

          const openDetail = () => {
            hide(listMode);
            show(detailMode);
          };
          const openList = () => {
            show(listMode);
            hide(detailMode);
          };

          const setModalVariant = (variant) => {
            if (!modalKicker || !modalTitle || !modalInput || !modalConfirm) return;

            if (variant === "join") {
              modalKicker.textContent = "加入家庭";
              modalTitle.textContent = "请输入邀请码";
              modalInput.value = "";
              modalInput.placeholder = "例如：FTB-8K2X";
              modalConfirm.setAttribute("aria-label", "确定加入");
            } else {
              modalKicker.textContent = "创建家庭";
              modalTitle.textContent = "请输入家庭名称";
              modalInput.value = "";
              modalInput.placeholder = "例如：李家厨房";
              modalConfirm.setAttribute("aria-label", "确定创建");
            }
          };

          const openModal = (variant) => {
            setModalVariant(variant);
            show(overlay);
            show(modal);
            setTimeout(() => modalInput && modalInput.focus(), 0);
          };
          const closeModal = () => {
            hide(modal);
            hide(overlay);
          };

          backButton?.addEventListener("click", () => {
            if (!detailMode?.classList.contains("hidden")) openList();
            else window.history.back?.();
          });

          overlay?.addEventListener("click", closeModal);
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeModal();
          });

          document.addEventListener("click", (e) => {
            const target = e.target?.closest?.("[data-action]");
            if (!target) return;
            const action = target.getAttribute("data-action");

            if (action === "open-family-detail") openDetail();
            if (action === "open-modal-join") openModal("join");
            if (action === "open-modal-create") openModal("create");
            if (action === "close-modal") closeModal();
          });
        })();
      </script>
    </div>
  </body>
</html>
