<!-- Top Navigation Anchor -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-orange-50/80 dark:bg-stone-900/80 backdrop-blur-md">
<div class="flex items-center gap-3">
<button class="hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-orange-700">arrow_back</span>
</button>

</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden">

<section class="mb-10 text-center md:text-left relative">
<div class="absolute -top-6 -left-4 w-16 h-16 bg-secondary-fixed opacity-20 rounded-full blur-2xl"></div>
<h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-on-surface mb-2">Add New Recipe</h1>
<p class="text-on-surface-variant font-medium">How would you like to build your masterpiece today?</p>
</section>
<!-- Bento Card Options -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
<!-- Image OCR Card -->
<button class="group flex flex-col items-center justify-center p-8 bg-surface-container-lowest rounded-xl hover:bg-tertiary-container transition-all duration-300 transform hover:-translate-y-1 shadow-sm">
<div class="w-16 h-16 rounded-full bg-tertiary/10 text-tertiary flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl" data-icon="camera" style="font-variation-settings: 'FILL' 1;">camera</span>
</div>
<span class="text-lg font-bold text-on-surface">Image OCR</span>
<span class="text-xs text-on-surface-variant mt-1">Scan physical books</span>
</button>
<!-- Manual Entry Card -->
<button class="group flex flex-col items-center justify-center p-8 bg-surface-container-lowest rounded-xl hover:bg-secondary-container transition-all duration-300 transform hover:-translate-y-1 shadow-sm">
<div class="w-16 h-16 rounded-full bg-secondary/10 text-secondary flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl" data-icon="edit" style="font-variation-settings: 'FILL' 1;">edit</span>
</div>
<span class="text-lg font-bold text-on-surface">Manual Entry</span>
<span class="text-xs text-on-surface-variant mt-1">Start from scratch</span>
</button>
<!-- Parse via Link Card (Spans 2 columns on mobile/tablet) -->
<div class="md:col-span-2 p-8 bg-primary-container/10 rounded-xl relative overflow-hidden">
<div class="absolute -right-8 -top-8 w-32 h-32 bg-primary-container/20 rounded-full blur-3xl"></div>
<div class="flex items-center gap-4 mb-6">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="link">link</span>
</div>
<div>
<h3 class="text-xl font-bold text-on-surface">Parse via Link</h3>
<p class="text-sm text-on-surface-variant">Import from any food blog or website</p>
</div>
</div>
<div class="relative group">
<input class="w-full h-16 px-6 bg-surface-container-lowest border-none rounded-full text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container transition-shadow shadow-sm" placeholder="Paste recipe URL here..." type="url"/>
<button class="absolute right-2 top-2 bottom-2 px-6 bg-primary-container text-on-primary-container font-bold rounded-full hover:scale-105 active:scale-95 transition-all">
                        Import
                    </button>
</div>
</div>
</div>
<!-- Checklist Section -->

<div class="flex items-center gap-2 mb-6">
<span class="material-symbols-outlined text-primary" data-icon="assignment_turned_in">assignment_turned_in</span>

</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

<div class="flex items-center gap-3 p-4 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-primary" data-icon="list_alt">list_alt</span>
<span class="text-sm font-semibold text-on-surface">Step-by-Step Guide</span>
</div>
<div class="flex items-center gap-3 p-4 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-secondary" data-icon="timer">timer</span>
<span class="text-sm font-semibold text-on-surface">Cooking Times</span>
</div>
<div class="flex items-center gap-3 p-4 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-error" data-icon="camera_alt">camera_alt</span>
<span class="text-sm font-semibold text-on-surface">Result Photo</span>
</div>
</div>
<!-- Illustration bleed -->
<div class="absolute -bottom-10 -right-10 opacity-10">
<span class="material-symbols-outlined text-[120px]" data-icon="skillet">skillet</span>
</div>

<span class="font-plus-jakarta text-[11px] font-bold uppercase tracking-wider mt-1">Recipes</span>
</button>

<span class="material-symbols-outlined text-2xl" data-icon="person">person</span>
<span class="font-plus-jakarta text-[11px] font-bold uppercase tracking-wider mt-1">Profile</span>
</button>
