<!DOCTYPE html>
<html class="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>饭桶宝 - 菜谱分享海报（UI 预览）</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              posterSurface: "#fff5ec",
              posterOnSurface: "#432900",
              posterOnSurfaceVariant: "#765524",
              posterPrimary: "#874e00",
              posterCream: "#ffe8d2",
              posterStepNumBg: "#f9e534",
              posterStepNumFg: "#5b5300",
              posterQrBorder: "rgba(135, 78, 0, 0.15)",
              posterShadow: "rgba(67, 41, 0, 0.08)",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "system-ui", "PingFang SC", "sans-serif"],
            },
            borderRadius: {
              card: "26px",
              qr: "10px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", system-ui, "PingFang SC", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .poster-blob-y {
        background: rgba(249, 229, 52, 0.2);
      }
      .poster-blob-g {
        background: rgba(145, 247, 142, 0.14);
      }
      .step-row {
        gap: 8px;
        padding: 5px 0 7px;
      }
      .step-row:not(:last-child) {
        border-bottom: 1px solid rgba(135, 78, 0, 0.08);
      }
      .step-row .step-num {
        width: 20px;
        height: 20px;
        min-width: 20px;
        min-height: 20px;
        border-radius: 5px;
        font-size: 10px;
      }
      .step-row .step-text {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.38;
        padding-top: 1px;
      }
    </style>
  </head>
  <body class="bg-posterSurface min-h-screen py-6 px-4">
    <p class="max-w-[375px] mx-auto text-xs font-semibold text-posterOnSurfaceVariant mb-4">
      菜谱分享海报 · UI 预览（375 基准）：顶图 → 双栏步骤 → 底栏左文右码
    </p>

    <div class="relative max-w-[375px] mx-auto">
      <div class="pointer-events-none absolute -right-8 -top-10 w-72 h-60 poster-blob-y rounded-full blur-3xl opacity-90"></div>
      <div class="pointer-events-none absolute -left-16 top-[38%] w-60 h-52 poster-blob-g rounded-full blur-3xl opacity-90"></div>

      <article
        class="relative bg-white rounded-card shadow-[0_6px_20px_var(--tw-shadow-color)] shadow-posterShadow overflow-hidden"
        style="--tw-shadow-color: rgba(67, 41, 0, 0.08)"
      >
        <!-- 顶部：整宽菜谱图（16:9），标题叠在图底 -->
        <div class="relative w-full aspect-video overflow-hidden rounded-t-card bg-posterCream">
          <img
            alt="菜谱封面"
            class="absolute inset-0 w-full h-full object-cover"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBBg5SIQJ2YZiMlJcp3a8nNcLollxI-bJ-rsHbN2a85yG4WDdKU7LH6Vx1TpTymWCAAj5TVuVBm9f5yA5hIgxWO5QRpwoiwMm3XONYPVO8dcV0h7YSNx90SLpmP7C-fZZy7t1WD6cl0Qg2Zy-XcMCb05aW324nmUkq3zByHhjdRAbzzRFKWrqi3K92NI0yDNW9uim-G2ymJwkqbjP0lbJZXDNFIEjAIGjE6w9_0j6Meq4RmKcRIKS6tCIq7CPMgLHNKeHk8e9XlqC0"
          />
          <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/55 via-black/5 to-transparent"></div>
          <div class="absolute left-[18px] right-[18px] bottom-4">
            <h1 class="text-2xl font-black text-white leading-tight tracking-tight drop-shadow-sm">西红柿炒蛋</h1>
          </div>
        </div>

        <!-- 中间：左右双栏 — 备菜 | 做菜 -->
        <div class="px-[18px] pt-3 pb-1">
          <div class="grid grid-cols-2 gap-x-3 gap-y-0">
            <div class="min-w-0 pr-1 border-r border-[rgba(135,78,0,0.1)]">
              <div class="flex items-center gap-2 mb-1">
                <span class="w-1 h-3.5 rounded-full bg-posterStepNumBg shrink-0"></span>
                <h2 class="text-[15px] font-black text-posterOnSurface leading-tight">备菜 · 2 步</h2>
              </div>
              <div class="step-row flex items-start">
                <div class="step-num flex shrink-0 items-center justify-center bg-posterStepNumBg font-black text-posterStepNumFg">1</div>
                <p class="step-text flex-1 text-posterOnSurface">切西红柿，打散鸡蛋。</p>
              </div>
              <div class="step-row flex items-start">
                <div class="step-num flex shrink-0 items-center justify-center bg-posterStepNumBg font-black text-posterStepNumFg">2</div>
                <p class="step-text flex-1 text-posterOnSurface">备好葱花与盐。</p>
              </div>
            </div>
            <div class="min-w-0 pl-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="w-1 h-3.5 rounded-full bg-posterStepNumBg shrink-0"></span>
                <h2 class="text-[15px] font-black text-posterOnSurface leading-tight">做菜 · 2 步</h2>
              </div>
              <div class="step-row flex items-start">
                <div class="step-num flex shrink-0 items-center justify-center bg-posterStepNumBg font-black text-posterStepNumFg">1</div>
                <p class="step-text flex-1 text-posterOnSurface">热锅下油，炒蛋盛出备用。</p>
              </div>
              <div class="step-row flex items-start">
                <div class="step-num flex shrink-0 items-center justify-center bg-posterStepNumBg font-black text-posterStepNumFg">2</div>
                <p class="step-text flex-1 text-posterOnSurface">炒软西红柿后回锅鸡蛋，调味出锅。</p>
              </div>
            </div>
          </div>
        </div>

        <!-- 底部：左文案 + 右小程序码 -->
        <div class="border-t border-[rgba(135,78,0,0.12)] px-[18px] pt-4 pb-4 bg-[#fffdfb]">
          <div class="flex items-center justify-between gap-3 min-h-[102px]">
            <div class="min-w-0 flex-1 pr-2 text-left">
              <p class="text-[11px] font-black text-posterOnSurfaceVariant">饭桶宝 · 家厨小帮手</p>
              <p class="mt-2 text-[11px] font-semibold text-posterOnSurfaceVariant/55 leading-snug">扫码查看完整菜谱并加入我的家庭菜谱</p>
            </div>
            <div
              class="shrink-0 rounded-qr border border-posterQrBorder bg-white p-1.5 shadow-sm"
              style="width: 90px; height: 90px; box-sizing: border-box"
              aria-label="小程序码占位"
            >
              <div
                class="w-[78px] h-[78px] mx-auto rounded bg-[repeating-linear-gradient(45deg,#eee,#eee_4px,#f5f5f5_4px,#f5f5f5_8px)] flex items-center justify-center text-[9px] font-bold text-posterOnSurfaceVariant text-center leading-tight px-1"
              >
                小程序码<br />78×78
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </body>
</html>
