          const familyOverlay = el("familyOverlay");

          const closeFamilySheetBtn = el("closeFamilySheetBtn");
          const familyInviteCode = el("familyInviteCode");
          const copyInviteBtn = el("copyInviteBtn");

          const toast = el("toast");
          const show = (node) => node && node.classList.remove("hidden");
          const hide = (node) => node && node.classList.add("hidden");
          const setText = (node, text) => node && (node.textContent = text);

          const toastMsg = (msg) => {
            setText(toast, msg);
            show(toast);
            clearTimeout(toast._t);
            toast._t = setTimeout(() => hide(toast), 1400);
          };

          const families = {
            f1: { name: "李家厨房", members: 4, invite: "FTB-8K2X" },
            f2: { name: "爷爷奶奶家", members: 3, invite: "FTB-3H7Q" },
          };
          let currentFamilyId = "f1";

          const syncUI = () => {
            const f = families[currentFamilyId];
            if (!f) return;
            setText(currentFamilyName, f.name);
            setText(currentFamilyMemberCountText, `成员 ${f.members} 人`);
            setText(familyInviteCode, f.invite);

            document.querySelectorAll(".family-item").forEach((btn) => {
              const id = btn.getAttribute("data-family-id");
              const isCurrent = id === currentFamilyId;
              const sub = btn.querySelector(".sub");
              const icon = btn.querySelector(".icon");
              if (sub) sub.textContent = isCurrent ? "当前" : "点击切换";
              if (icon) {
                icon.textContent = isCurrent ? "check_circle" : "chevron_right";
                icon.classList.toggle("text-primary", isCurrent);
                icon.classList.toggle("text-outline", !isCurrent);
              }
            });
          };

          const openSheet = () => {
            syncUI();
            show(familyOverlay);
            show(familySheet);
          };
          const closeSheet = () => {
            hide(familySheet);
            hide(familyOverlay);
          };

          familySwitchBtn?.addEventListener("click", openSheet);
          familyOverlay?.addEventListener("click", closeSheet);
          closeFamilySheetBtn?.addEventListener("click", closeSheet);
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeSheet();
          });

          document.addEventListener("click", (e) => {
            const btn = e.target?.closest?.(".family-item");
            if (!btn) return;
            const id = btn.getAttribute("data-family-id");
            if (!id || id === currentFamilyId) return closeSheet();
            currentFamilyId = id;
            syncUI();
            toastMsg("已切换家庭（示例）");
            closeSheet();
          });

          copyInviteBtn?.addEventListener("click", async () => {
            const code = familyInviteCode?.textContent || "";
            try {
              await navigator.clipboard.writeText(code);
              toastMsg("邀请码已复制（示例）");
            } catch {
              toastMsg("复制失败（示例）");
            }
          });

          syncUI();
        })();
      </script>
    </div>
  </body>
</html>
