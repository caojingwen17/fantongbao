<!DOCTYPE html>
<html class="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Fantongbao - 做菜清单</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error-dim": "#b92902",
              "outline-variant": "#d0a66d",
              "surface-container-low": "#ffeedc",
              primary: "#874e00",
              "on-primary": "#fff0e5",
              "on-error-container": "#520c00",
              "primary-dim": "#764400",
              tertiary: "#006b1b",
              "on-secondary-container": "#5b5300",
              "primary-container": "#ff9800",
              "on-surface-variant": "#765524",
              "on-surface": "#432900",
              "secondary-fixed": "#f9e534",
              "on-tertiary-container": "#005e17",
              "inverse-on-surface": "#bf965e",
              "inverse-surface": "#170c00",
              "surface-container-highest": "#ffd6a2",
              "tertiary-fixed": "#91f78e",
              "on-secondary-fixed-variant": "#665c00",
              "tertiary-dim": "#005d16",
              "primary-fixed-dim": "#ec8c00",
              "on-tertiary-fixed": "#00480f",
              "on-background": "#432900",
              "on-primary-container": "#4a2800",
              "on-tertiary": "#d1ffc8",
              "tertiary-fixed-dim": "#83e881",
              "inverse-primary": "#ff9800",
              "secondary-fixed-dim": "#ead723",
              "on-secondary": "#fff4b0",
              "surface-tint": "#874e00",
              outline: "#95703c",
              "error-container": "#f95630",
              "secondary-dim": "#595000",
              "on-primary-fixed-variant": "#563000",
              surface: "#fff5ec",
              "primary-fixed": "#ff9800",
              "on-tertiary-fixed-variant": "#00691a",
              "surface-container": "#ffe4c4",
              "surface-bright": "#fff5ec",
              error: "#b02500",
              "on-primary-fixed": "#271300",
              "secondary-container": "#f9e534",
              "surface-container-high": "#ffddb3",
              secondary: "#665c00",
              "on-error": "#ffefec",
              "on-secondary-fixed": "#474000",
              "tertiary-container": "#91f78e",
              "surface-variant": "#ffd6a2",
              "surface-dim": "#ffcc86",
              background: "#fff5ec",
              "surface-container-lowest": "#ffffff",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Plus Jakarta Sans"],
              label: ["Plus Jakarta Sans"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .sticky-blur {
        background: rgba(255, 245, 236, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .disabled {
        opacity: 0.5;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface min-h-screen">
    <div class="mx-auto w-full max-w-[375px] min-h-[812px] bg-surface relative overflow-hidden">
      <!-- Decorative blobs -->
      <div class="pointer-events-none absolute -top-24 -right-24 w-64 h-64 rounded-full bg-secondary-fixed opacity-18 blur-3xl"></div>
      <div class="pointer-events-none absolute top-52 -left-24 w-64 h-64 rounded-full bg-tertiary-fixed opacity-12 blur-3xl"></div>

      <!-- Top App Bar -->
      <header class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] z-50 flex items-center justify-between px-5 py-4 bg-orange-50/80 dark:bg-stone-900/80 backdrop-blur-md">
        <button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface-variant active:scale-90 transition-transform" aria-label="返回">
          <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
        </button>
        <div class="text-lg font-black tracking-tight">做菜清单</div>
        <div class="w-10 h-10" aria-hidden="true"></div>
      </header>

      <main class="relative z-10 pt-24 px-5 pb-10 space-y-5">
        <!-- Header -->
        <section class="bg-surface-container-lowest rounded-lg p-5 space-y-3">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <div class="text-xs font-black uppercase tracking-widest text-on-surface-variant">点菜单</div>
              <div class="mt-1 text-2xl font-extrabold tracking-tight truncate">工作日晚餐（2 道菜）</div>
              <div class="mt-1 text-sm font-semibold text-on-surface-variant">
                进度：<span id="progressText" class="font-extrabold text-primary">0/5</span>
              </div>
            </div>
            <div class="w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center">
              <span class="material-symbols-outlined text-on-tertiary-container" data-icon="skillet">skillet</span>
            </div>
          </div>
          <div class="text-xs font-semibold text-on-surface-variant">按菜分组勾选备菜/做菜步骤，全部完成后闭环</div>
        </section>

        <!-- Groups -->
        <section id="groups" class="space-y-4">
          <!-- Group 1 -->
          <div class="group-card bg-surface-container-lowest rounded-lg overflow-hidden" data-group="g1">
            <button class="group-toggle w-full px-5 py-4 flex items-center justify-between gap-3 active:scale-[0.995] transition-transform" aria-label="展开/收起">
              <div class="min-w-0">
                <div class="text-lg font-extrabold truncate">西红柿炒蛋</div>
                <div class="mt-1 text-xs font-semibold text-on-surface-variant">备注：少放盐，鸡蛋偏嫩</div>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-primary px-3 py-1 bg-surface-container-high rounded-full"><span class="group-done">0</span>/<span class="group-total">3</span></span>
                <span class="chev material-symbols-outlined text-outline" data-icon="expand_less">expand_less</span>
              </div>
            </button>
            <div class="group-body px-5 pb-5 space-y-4">
              <div class="space-y-2">
                <div class="text-sm font-extrabold text-on-surface">备菜步骤</div>
                <label class="step-item flex items-start gap-3 bg-surface-container rounded-lg px-4 py-3 cursor-pointer" data-step="s1">
                  <input class="step-check mt-1 h-5 w-5 rounded border-surface-container text-primary focus:ring-primary-container" type="checkbox" />
                  <div class="min-w-0">
                    <div class="font-semibold text-on-surface leading-relaxed">切西红柿，打散鸡蛋。</div>
                  </div>
                </label>
              </div>
              <div class="space-y-2">
                <div class="text-sm font-extrabold text-on-surface">做菜步骤</div>
                <label class="step-item flex items-start gap-3 bg-surface-container rounded-lg px-4 py-3 cursor-pointer" data-step="s2">
                  <input class="step-check mt-1 h-5 w-5 rounded border-surface-container text-primary focus:ring-primary-container" type="checkbox" />
                  <div class="min-w-0">
                    <div class="font-semibold text-on-surface leading-relaxed">先炒蛋盛出备用。</div>
                  </div>
                </label>
                <label class="step-item flex items-start gap-3 bg-surface-container rounded-lg px-4 py-3 cursor-pointer" data-step="s3">
                  <input class="step-check mt-1 h-5 w-5 rounded border-surface-container text-primary focus:ring-primary-container" type="checkbox" />
                  <div class="min-w-0">
                    <div class="font-semibold text-on-surface leading-relaxed">炒软西红柿回锅鸡蛋，调味出锅。</div>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <!-- Group 2 -->
          <div class="group-card bg-surface-container-lowest rounded-lg overflow-hidden" data-group="g2">
            <button class="group-toggle w-full px-5 py-4 flex items-center justify-between gap-3 active:scale-[0.995] transition-transform" aria-label="展开/收起">
              <div class="min-w-0">
                <div class="text-lg font-extrabold truncate">麻婆豆腐</div>
                <div class="mt-1 text-xs font-semibold text-on-surface-variant">备注：微辣即可</div>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-primary px-3 py-1 bg-surface-container-high rounded-full"><span class="group-done">0</span>/<span class="group-total">2</span></span>
                <span class="chev material-symbols-outlined text-outline" data-icon="expand_less">expand_less</span>
              </div>
            </button>
            <div class="group-body px-5 pb-5 space-y-4">
              <div class="space-y-2">
                <div class="text-sm font-extrabold text-on-surface">备菜步骤</div>
                <label class="step-item flex items-start gap-3 bg-surface-container rounded-lg px-4 py-3 cursor-pointer" data-step="s4">
                  <input class="step-check mt-1 h-5 w-5 rounded border-surface-container text-primary focus:ring-primary-container" type="checkbox" />
                  <div class="min-w-0">
                    <div class="font-semibold text-on-surface leading-relaxed">豆腐切块，准备葱花与豆瓣酱。</div>
                  </div>
                </label>
              </div>
              <div class="space-y-2">
                <div class="text-sm font-extrabold text-on-surface">做菜步骤</div>
                <label class="step-item flex items-start gap-3 bg-surface-container rounded-lg px-4 py-3 cursor-pointer" data-step="s5">
                  <input class="step-check mt-1 h-5 w-5 rounded border-surface-container text-primary focus:ring-primary-container" type="checkbox" />
                  <div class="min-w-0">
                    <div class="font-semibold text-on-surface leading-relaxed">炒香底料，加入豆腐小火煮入味。</div>
                  </div>
                </label>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Completion prompt -->
      <div id="completeOverlay" class="hidden fixed inset-0 z-[70] bg-black/35 backdrop-blur-[2px]"></div>
      <div id="completeModal" class="hidden fixed left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-[80] w-[335px] max-w-[90%] bg-white/90 dark:bg-stone-950/90 backdrop-blur-xl rounded-lg shadow-[0_12px_24px_rgba(67,41,0,0.12)] p-5">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="text-xs font-black uppercase tracking-widest text-on-surface-variant">提示</div>
            <div class="mt-1 text-xl font-extrabold tracking-tight">确认已完成所有制作步骤吗？</div>
          </div>
          <button data-action="close-complete" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center active:scale-90 transition-transform" aria-label="关闭">
            <span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
          </button>
        </div>
        <div class="mt-3 text-sm font-semibold text-on-surface-variant leading-relaxed">
          确认后将把点菜单状态更新为已完成，并回到首页（示例）。
        </div>
        <div class="mt-5 grid grid-cols-2 gap-3">
          <button data-action="close-complete" class="py-4 rounded-full bg-surface-container text-on-surface font-extrabold active:scale-95 transition-transform" aria-label="取消">取消</button>
          <button id="confirmAllDoneBtn" class="py-4 rounded-full bg-tertiary-container text-on-tertiary-container font-extrabold active:scale-95 transition-transform" aria-label="确认完成">
            确认完成
          </button>
        </div>
      </div>

      <!-- Toast -->
      <div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-10 z-[90] bg-inverse-surface/90 text-inverse-on-surface px-4 py-2 rounded-full text-sm font-extrabold shadow-[0_12px_24px_rgba(0,0,0,0.25)]">
        提示
      </div>

      <script>
        (function () {
          const el = (id) => document.getElementById(id);
          const groups = el("groups");
          const progressText = el("progressText");
          const completeOverlay = el("completeOverlay");
          const completeModal = el("completeModal");
          const confirmAllDoneBtn = el("confirmAllDoneBtn");
          const toast = el("toast");

          const show = (node) => node && node.classList.remove("hidden");
          const hide = (node) => node && node.classList.add("hidden");
          const setText = (node, text) => node && (node.textContent = text);

          const toastMsg = (msg) => {
            setText(toast, msg);
            show(toast);
            clearTimeout(toast._t);
            toast._t = setTimeout(() => hide(toast), 1400);
          };

          const updateCounts = () => {
            const checks = Array.from(groups.querySelectorAll(".step-check"));
            const total = checks.length;
            const done = checks.filter((c) => c.checked).length;
            setText(progressText, `${done}/${total}`);

            groups.querySelectorAll(".group-card").forEach((card) => {
              const totalEl = card.querySelector(".group-total");
              const doneEl = card.querySelector(".group-done");
              const localChecks = Array.from(card.querySelectorAll(".step-check"));
              const localTotal = localChecks.length;
              const localDone = localChecks.filter((c) => c.checked).length;
              if (totalEl) totalEl.textContent = String(localTotal);
              if (doneEl) doneEl.textContent = String(localDone);
            });

            if (total > 0 && done === total) {
              show(completeOverlay);
              show(completeModal);
            }
          };

          const toggleGroup = (card) => {
            const body = card.querySelector(".group-body");
            const chev = card.querySelector(".chev");
            const hidden = body.classList.contains("hidden");
            if (hidden) body.classList.remove("hidden");
            else body.classList.add("hidden");
            if (chev) chev.textContent = hidden ? "expand_less" : "expand_more";
          };

          groups.addEventListener("click", (e) => {
            const toggle = e.target.closest?.(".group-toggle");
            if (toggle) {
              const card = toggle.closest(".group-card");
              if (card) toggleGroup(card);
            }
          });

          groups.addEventListener("change", (e) => {
            if (!e.target.classList.contains("step-check")) return;
            updateCounts();
          });

          const closeComplete = () => {
            hide(completeModal);
            hide(completeOverlay);
          };
          completeOverlay.addEventListener("click", closeComplete);
          document.addEventListener("click", (e) => {
            const action = e.target?.closest?.("[data-action]")?.getAttribute?.("data-action");
            if (action === "close-complete") closeComplete();
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeComplete();
          });

          confirmAllDoneBtn.addEventListener("click", () => {
            closeComplete();
            toastMsg("已完成制作（示例）");
          });

          // init totals
          updateCounts();
        })();
      </script>
    </div>
  </body>
</html>
