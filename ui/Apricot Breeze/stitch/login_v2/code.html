<!DOCTYPE html>
<html class="light" lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Fantongbao - 登录</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error-dim": "#b92902",
              "outline-variant": "#d0a66d",
              "surface-container-low": "#ffeedc",
              primary: "#874e00",
              "on-primary": "#fff0e5",
              "on-error-container": "#520c00",
              "primary-dim": "#764400",
              tertiary: "#006b1b",
              "on-secondary-container": "#5b5300",
              "primary-container": "#ff9800",
              "on-surface-variant": "#765524",
              "on-surface": "#432900",
              "secondary-fixed": "#f9e534",
              "on-tertiary-container": "#005e17",
              "inverse-on-surface": "#bf965e",
              "inverse-surface": "#170c00",
              "surface-container-highest": "#ffd6a2",
              "tertiary-fixed": "#91f78e",
              "on-secondary-fixed-variant": "#665c00",
              "tertiary-dim": "#005d16",
              "primary-fixed-dim": "#ec8c00",
              "on-tertiary-fixed": "#00480f",
              "on-background": "#432900",
              "on-primary-container": "#4a2800",
              "on-tertiary": "#d1ffc8",
              "tertiary-fixed-dim": "#83e881",
              "inverse-primary": "#ff9800",
              "secondary-fixed-dim": "#ead723",
              "on-secondary": "#fff4b0",
              "surface-tint": "#874e00",
              outline: "#95703c",
              "error-container": "#f95630",
              "secondary-dim": "#595000",
              "on-primary-fixed-variant": "#563000",
              surface: "#fff5ec",
              "primary-fixed": "#ff9800",
              "on-tertiary-fixed-variant": "#00691a",
              "surface-container": "#ffe4c4",
              "surface-bright": "#fff5ec",
              error: "#b02500",
              "on-primary-fixed": "#271300",
              "secondary-container": "#f9e534",
              "surface-container-high": "#ffddb3",
              secondary: "#665c00",
              "on-error": "#ffefec",
              "on-secondary-fixed": "#474000",
              "tertiary-container": "#91f78e",
              "surface-variant": "#ffd6a2",
              "surface-dim": "#ffcc86",
              background: "#fff5ec",
              "surface-container-lowest": "#ffffff",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Plus Jakarta Sans"],
              label: ["Plus Jakarta Sans"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .bubbly-gradient {
        background: linear-gradient(135deg, #874e00 0%, #ff9800 100%);
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface min-h-screen">
    <div class="mx-auto w-full max-w-[375px] min-h-[812px] bg-surface relative overflow-hidden">
      <!-- Decorative blobs -->
      <div class="pointer-events-none absolute -top-24 -right-24 w-64 h-64 rounded-full bg-secondary-fixed opacity-20 blur-3xl"></div>
      <div class="pointer-events-none absolute top-24 -left-24 w-64 h-64 rounded-full bg-tertiary-fixed opacity-15 blur-3xl"></div>
      <div class="pointer-events-none absolute -bottom-32 left-1/2 -translate-x-1/2 w-[28rem] h-[28rem] rounded-full bg-primary-container opacity-10 blur-3xl"></div>

      <main class="relative z-10 px-6 pt-16 pb-10">
        <!-- Brand -->
        <section class="text-center">
          <div class="mx-auto w-16 h-16 rounded-full bg-primary-container overflow-hidden shadow-[0_12px_24px_rgba(67,41,0,0.12)]">
            <img alt="饭桶宝" class="w-full h-full object-cover" src="fantongbao" />
          </div>
          <h1 class="mt-4 text-4xl font-black text-orange-700 italic tracking-tight">饭桶宝</h1>
          <p class="mt-2 text-sm font-semibold text-on-surface-variant">请设置头像、填写昵称后登录，用于家庭内展示</p>
        </section>

        <!-- 静默恢复提示（显示态示例：把 hidden 去掉即可） -->
        <section class="mt-6 hidden">
          <div class="bg-surface-container-lowest rounded-lg p-4 flex items-center gap-3">
            <span class="material-symbols-outlined text-primary animate-spin" data-icon="progress_activity">progress_activity</span>
            <div class="text-sm font-bold text-on-surface">正在恢复登录…</div>
          </div>
        </section>

        <!-- Form Card -->
        <section class="mt-8 bg-surface-container rounded-lg p-6 space-y-5">
          <!-- Avatar -->
          <div class="flex items-center justify-between gap-4">
            <div>
              <div class="text-sm font-extrabold text-on-surface">头像</div>
              <div class="mt-1 text-xs font-semibold text-on-surface-variant">点击选择头像</div>
            </div>
            <button class="w-14 h-14 rounded-full bg-surface-container-lowest flex items-center justify-center overflow-hidden active:scale-95 transition-transform" aria-label="选择头像（chooseAvatar）">
              <span class="material-symbols-outlined text-outline" data-icon="add_a_photo">add_a_photo</span>
            </button>
          </div>

          <!-- Avatar chosen state example -->
          <div class="hidden items-center justify-between gap-4">
            <div>
              <div class="text-sm font-extrabold text-on-surface">头像</div>
              <div class="mt-1 text-xs font-semibold text-on-surface-variant">已选择</div>
            </div>
            <button class="w-14 h-14 rounded-full bg-surface-container-lowest overflow-hidden active:scale-95 transition-transform" aria-label="更换头像（chooseAvatar）">
              <img
                alt="头像预览"
                class="w-full h-full object-cover"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwLo-hWezFLl2m7g1Ehulz5d-_2kLUxjJPKdz6OkvWJJRGC55j3P275-TYhwLoZ1rUFI2dxx2HANghvfSIlWwfP9-CjhE0RVd42KbxHapF0pQ2jr2mQf9W6aHmnaPznCCT2gnFM4e3DXcf5o2wxJ2xdBTb42vog1sNEtt2MCPldM3mIs6XSa8N9ySuN6zGowgFK1sKqzC_S9np2kIu_dhmwoAZGq2Cn_F-FI5H_i-e1h58AuTDSNgXMMJWE7iJq6eUoEKeu3VyoAY"
              />
            </button>
          </div>

          <!-- Nickname -->
          <div class="space-y-2">
            <label class="text-sm font-extrabold text-on-surface" for="nickname">昵称</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-outline" data-icon="badge">badge</span>
              </div>
              <input
                id="nickname"
                class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-none rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary-container transition-all"
                placeholder="请输入昵称"
                type="text"
                value=""
              />
            </div>
          </div>

          <!-- Submit -->
          <button class="w-full py-4 rounded-full bubbly-gradient text-on-primary font-extrabold text-lg shadow-[0_12px_24px_rgba(135,78,0,0.20)] active:scale-95 transition-transform flex items-center justify-center gap-2" aria-label="完成登录">
            <span class="material-symbols-outlined" data-icon="login">login</span>
            完成登录
          </button>

          <!-- Loading state example -->
          <button class="hidden w-full py-4 rounded-full bubbly-gradient text-on-primary font-extrabold text-lg shadow-[0_12px_24px_rgba(135,78,0,0.20)] opacity-80 cursor-not-allowed flex items-center justify-center gap-2" aria-label="登录中" disabled>
            <span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>
            登录中…
          </button>
        </section>

        <!-- Footer Note -->
        <section class="mt-6 text-center">
          <p class="text-xs font-semibold text-on-surface-variant">
            体验版/正式版说明：此页面仅为样式稿，交互将由小程序实现。
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
